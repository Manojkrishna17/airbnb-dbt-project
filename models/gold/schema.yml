version: 2

models:
  - name: dim_hosts
    columns:
      - name: host_id
        data_tests: [unique, not_null]

  - name: dim_listings
    columns:
      - name: listing_id
        data_tests: [unique, not_null]
      - name: host_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_hosts')
                field: host_id

  - name: fact_bookings
    columns:
      - name: booking_id
        data_tests: [unique, not_null]
      - name: listing_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings')
                field: listing_id
      - name: host_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_hosts')
                field: host_id

  - name: fact_booking_status_history
    columns:
      - name: booking_version_id
        data_tests: [unique, not_null]
      - name: booking_id
        data_tests: [not_null]
      - name: booking_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['CONFIRMED', 'CANCELLED']