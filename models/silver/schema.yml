version: 2

models:
  - name: silver_bookings
    columns:
      - name: booking_id
        data_tests: [unique, not_null]
      - name: booking_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['CONFIRMED', 'CANCELLED']
      - name: listing_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_listings')
                field: listing_id

  - name: silver_listings
    columns:
      - name: listing_id
        data_tests: [unique, not_null]
      - name: host_id
        data_tests:
          - relationships:
              arguments:
                to: ref('silver_hosts')
                field: host_id

  - name: silver_hosts
    columns:
      - name: host_id
        data_tests: [unique, not_null]
      - name: response_rate_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['Very Good', 'Good', 'Fair', 'Poor', 'Unknown']